<!DOCTYPE html>
<html>
<head>
  <title>Variant Price Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h2>Variant Price Calculator</h2>

<textarea id="input" rows="8" cols="80" placeholder="Paste variants here..."></textarea>
<br><br>

<button onclick="runCalculator()">Calculate</button>

<h3>Results:</h3>
<table border="1" id="output">
  <thead>
    <tr>
      <th>Model</th>
      <th>Code</th>
      <th>Grade</th>
      <th>Config</th>
      <th>Price</th>
      <th>Extra</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script src="script.js"></script>

</body>
</html>
